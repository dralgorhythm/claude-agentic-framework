name: framework-invariants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: Check framework invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run invariant checks
        run: ./scripts/check-invariants.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run shellcheck
        # SC2319/SC2164 (scripts/check-invariants.sh) and SC1087 (scripts/init-framework.sh)
        # are pre-existing findings out of scope for this change (no hook, no harness case
        # protects them yet) — tracked for a future cleanup pass rather than fixed blind here.
        # File list is filesystem-derived (find, not a hardcoded list) so new hooks/scripts/
        # fixtures are covered automatically — see scripts/test-hooks.sh's own extension model.
        run: |
          # shellcheck disable=SC2046  # deliberate word-split: one file path per shellcheck arg
          shellcheck -e SC2319,SC2164,SC1087 $(find .claude/hooks scripts -name '*.sh' -type f | sort)

  hook-tests:
    name: Hook behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run hook behavior harness
        run: ./scripts/test-hooks.sh

  secret-scan:
    name: Secret scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pins its own setup-trivy dependency; older releases referenced since-deleted setup-trivy tags)
        with:
          scan-type: fs
          # No manifests exist in this repo today, so vuln findings are trivially green here — the scanner is real for forks/adopters that add them.
          scanners: secret,vuln
          exit-code: 1

  diff-size:
    name: Diff size advisory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # This job is advisory only and must never fail a build by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Report changed LOC (non-blocking)
        run: |
          total=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" 2>/dev/null | awk '{added+=$1; deleted+=$2} END {print added+deleted+0}' || echo 0)
          echo "Changed LOC: $total"
          if [ "$total" -gt 400 ]; then
            echo "::warning::PR changes $total lines (added+deleted), exceeding the ~400 LOC guidance. Code-review effectiveness drops beyond ~400 changed LOC (SmartBear/Cisco). Consider splitting into smaller, independently reviewable PRs."
          fi
